name: Weekly NBA strength of schedule

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      start:
        description: "Any date in the week, YYYY-MM-DD (blank = this/next Monday)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Update rankings from ESPN BPI
        continue-on-error: true
        run: |
          python - <<'PY'
          import re, csv, requests
          url = "https://www.espn.com/nba/bpi"
          html = requests.get(url, headers={"User-Agent": "Mozilla/5.0"}, timeout=30).text
          order = []
          for slug in re.findall(r"/nba/team/_/name/[a-z]+/([a-z0-9-]+)", html):
              if slug not in order:
                  order.append(slug)
          if len(order) != 30 or order == sorted(order):
              raise SystemExit("Could not read BPI order (found %d teams); keeping old rankings.csv" % len(order))
          with open("rankings.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["team", "rank"])
              for i, slug in enumerate(order, 1):
                  w.writerow([slug.replace("-", " "), i])
          print("Top 5:", order[:5])
          PY

      - name: Build graphic
        env:
          RANKINGS_URL: ${{ vars.RANKINGS_URL }}
          START: ${{ github.event.inputs.start }}
        run: |
          mkdir -p output
          ARGS=""
          if [ -n "$START" ]; then ARGS="--start $START"; fi
          if [ -n "$RANKINGS_URL" ]; then
            python nba_sos.py --rankings-url "$RANKINGS_URL" --save-rankings rankings.csv --out output $ARGS \
              || python nba_sos.py --rankings rankings.csv --out output $ARGS
          else
            python nba_sos.py --rankings rankings.csv --out output $ARGS
          fi
          cp "$(ls -t output/*.png | head -1)" latest.png

      - name: Send graphic to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            curl -sS -f -F "content=NBA strength of schedule" -F "file=@latest.png" "$DISCORD_WEBHOOK"
          fi

      - name: Save results to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Weekly strength-of-schedule update"
          git push